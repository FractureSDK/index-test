name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          # Placeholder values so the build doesn't depend on real secrets —
          # real deployments (Vercel/Netlify) inject the actual ones.
          NEXT_PUBLIC_SITE_URL: https://example.com
